[project]
name = "tribunal"
version = "0.1.0"
description = "Board game rules adjudicator & strategy analyst chatbot"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "openai>=3.3.1",
    "pyyaml>=6.0.3",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.3",
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20260906",
    "datamodel-code-generator>=0.82.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tribunal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "TID252", # flake8-tidy-imports: 相対 import 禁止（レイヤの依存方向を追いやすくする）
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true

# slack_bolt / slack_sdk は型スタブを同梱しない（py.typed なし）。
# strict を全体で緩めず、この 2 module だけ許容する。
[[tool.mypy.overrides]]
module = ["slack_bolt.*", "slack_sdk.*"]
ignore_missing_imports = true

[tool.datamodel-codegen]
input = "games/schema/games.schema.json"
input-file-type = "jsonschema"
output = "src/tribunal/knowledge/games_schema.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.11"
use-annotated = true
field-constraints = true
strict-types = ["str", "int"]
use-standard-collections = true
use-union-operator = true
use-title-as-name = true
class-name-suffix = "Schema"
use-schema-description = true
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]
custom-file-header = """# 生成物。直接編集しない。
# games/schema/games.schema.json を変えて `uv run datamodel-codegen` で再生成する。"""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
