[project]
name = "tribunal"
version = "0.1.0"
description = "Board game rules adjudicator & strategy analyst chatbot"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tribunal"]
